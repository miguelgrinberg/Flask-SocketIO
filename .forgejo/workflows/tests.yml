name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.14
      - run: python -m pip install --upgrade pip wheel tox
      - run: tox -elint
  tests:
    name: "tests-${{ matrix.python }} ${{ matrix.flask }}"
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', 'pypy-3.11']
        flask: ['<2.2', '<3.0', '<3.1', '<3.2', '']
        exclude:
          - flask: '<2.2'
            python: '3.14'
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip wheel tox
      - run: tox -epy
        env:
          FLASK_VERSION: ${{ matrix.flask }}
